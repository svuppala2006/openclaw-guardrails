# NemoClaw: Self-sandboxed OpenClaw Claw CR
#
# Deploys OpenClaw without the OpenShell sandbox plugin. Agent code executes
# directly inside the gateway pod, which is restricted by OpenShift's
# restricted-v2 SCC and resource limits.
#
# Usage:
#   1. Replace all <PLACEHOLDER> values
#   2. Create the credential secret (see docs/nemoclaw.md Step 1)
#   3. oc apply -f nemoclaw-cr.yaml
#
# This can coexist with a standard OpenShell-backed Claw in the same namespace.

apiVersion: claw.sandbox.redhat.com/v1alpha1
kind: Claw
metadata:
  name: nemoclaw
  namespace: <YOUR_NAMESPACE>
  labels:
    app.kubernetes.io/managed-by: openclaw-deployer
spec:
  config:
    management: operator
    mergeMode: merge
    raw:
      agents:
        defaults:
          sandbox:
            # "off" = no external sandbox; code runs directly in the pod
            mode: "off"
        list:
        - id: default
          identity:
            name: NemoClaw
          name: NemoClaw
          workspace: ~/.openclaw/workspace

  credentials:
  - name: anthropic-vertex
    provider: anthropic
    type: gcp
    gcp:
      project: <GCP_PROJECT>
      location: <VERTEX_AI_REGION>
    secretRef:
    - key: sa-key.json
      name: openclaw-nemoclaw-anthropic-vertex-gcp

  idle: false

  image: image-registry.openshift-image-registry.svc:5000/<YOUR_NAMESPACE>/openclaw-openshell:latest

  # Resource limits to contain runaway agent code
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

  network:
    # No additionalEgress needed -- no OpenShell gateway to reach
    inClusterBypass: true

  # No plugins -- no OpenShell sandbox plugin
  plugins: []
